# gasperm -- RUN configuration (the experiment)
#
# The file that changes most often: a new pressure step, a different gas, a
# different operator. The rig is in hardware.yaml; the plug is in sample.yaml.
#
# Supported pressure units: MPa, Pa, atm, bar, kPa, psi

# Who ran it. Copied into every run's metadata for traceability.
operator: ''
institution: ''
project: ''
experiment_id: ''
notes: ''

# How this run measures permeability.
#   steady_state -- drive gas through the plug and measure the flow
#                   (the compressible Darcy equation).
#   pulse_decay  -- apply a small pulse to a closed upstream vessel and
#                   watch P1-P2 decay into a closed downstream one. NO
#                   flow is measured, which is what makes it usable below
#                   about ten microdarcy where a flowmeter sized for a
#                   normal plug reports only its own zero offset.
# Pulse decay requires downstream_pressure: measured, reads no flowmeter,
# and takes its vessel volumes from hardware.reservoirs.
method: steady_state                          # steady_state | pulse_decay
purpose: measurement                          # measurement | leak_test (see 'collect --leak-test')

# Working gas and where its properties come from.
gas:
  name: Nitrogen                              # any CoolProp fluid: Air, CarbonDioxide, Methane, ...
  properties_source: coolprop                 # coolprop (recommended) | fixed
  fixed_viscosity_cp: null                    # only when properties_source == fixed
  fixed_reason: ''
  viscosity_relative_uncertainty: 0.01        # relative, for the GUM budget
  compressibility_relative_uncertainty: 0.01
  real_gas_correction: false                  # divide reference flow by Z

# Which meter from hardware.yaml this run uses. Defined meters:
#   high_range, low_range
# null takes hardware.default_flowmeter. Only this meter's analog input
# is read; the others are never added to the DAQ task.
flowmeter: null                               # one of: high_range, low_range (null = rig default)

# Confining/overburden pressure for this run. Usually MPa-scale while
# pore pressure is kPa-scale, hence its own independent unit.
confining_pressure: null
confining_pressure_unit: MPa

# P2 in the Darcy equation. 'measured' reads the outlet transducer, which
# is what a normally-plumbed rig wants. A number overrides it with a value
# you supply -- for an outlet that vents to atmosphere, where the
# transducer reads noise around zero or is not fitted.
# P2 sets the apparent permeability AND the mean pressure, which is the
# Klinkenberg regression's x-axis, so 'klinkenberg' refuses to mix runs
# that used different conventions.
downstream_pressure: measured                 # measured | a number in downstream_pressure_unit
downstream_pressure_unit: kPa                 # only used when the above is a number
downstream_pressure_uncertainty:
  kind: absolute
  value: 0.1
  distribution: rectangular
  coverage_factor: 2.0
  degrees_of_freedom: null
  source: operator-supplied downstream pressure

# Ambient reference -- NOT P2 (see downstream_pressure above). It converts
# GAUGE transducer readings to the absolute pressures the Darcy equation
# needs, and serves as the flowmeter reference when actual_pressure_source
# is 'atmospheric'.
atmospheric_pressure: 101.325
atmospheric_pressure_unit: kPa
atmospheric_pressure_uncertainty:
  kind: absolute
  value: 0.1
  distribution: rectangular
  coverage_factor: 2.0
  degrees_of_freedom: null
  source: local barometric reading

# Permeability is only representative once the rig has equilibrated, so
# the reported result is taken from the detected steady-state window.
# Two criteria must hold on every listed signal, over consecutive windows:
#   scatter -- coefficient of variation <= relative_stddev_tolerance
#   drift   -- fractional change of an OLS line across the window
#              <= relative_drift_tolerance
# The drift test is the important one: a slow ramp has small scatter in
# any short window and would pass a scatter-only test forever.
steady_state:
  enabled: true
  window_s: 30.0                              # trailing window each test runs over
  required_windows: 3                         # consecutive passes before declaring steady
  min_samples: 10
  settling_time_s: 0.0                        # ignore this much of the run start outright
  relative_stddev_tolerance: 0.02
  relative_drift_tolerance: 0.01
  slope_significance: null                    # null = use the drift bound alone
  signals: [permeability, inlet_pressure, flow]
  max_wait_s: null                            # null = wait indefinitely
  equilibration_factor: 1.0                   # warn if the window is shorter than this x phi.mu.L^2/(k.P)

# Only read when method is pulse_decay.
# The fit runs from fit_start_fraction down to fit_end_fraction of the
# pulse. The top is skipped for two independent reasons: the valve
# transient, and the fact that a single exponential is asymptotic rather
# than exact -- with finite sample storage the higher decay modes are
# still dying, and including them biases the rate high. The bottom is
# skipped because late samples are noise-dominated: on this rig, running
# to dP/dP0 = 0.05 takes four times as long as 0.5 and is slightly WORSE.
# The run continues a little past the window (stop_below_fraction) so
# there is data below it to pin the fitted offset.
pulse_decay:
  upstream_spacers: []                        # spacers fitted this run; --spacers overrides
  min_pulse_pressure: 20.0                    # smallest differential that counts as a pulse
  pulse_pressure_unit: kPa
  max_pulse_fraction: 0.1                     # largest dP0/P_mean the linearisation allows
  stop_below_fraction: 0.4                    # end the run at this dP/dP0
  max_decay_s: null                           # null = wait indefinitely
  fit_start_fraction: 0.9                     # fit from this fraction of dP0 ...
  fit_end_fraction: 0.5                       # ... down to this one
  fit_bin_s: 1.0                              # bin before fitting; null = every sample
  fit_offset: true                            # two transducers have a zero mismatch; keep this on
  min_fit_samples: 20
  min_r_squared: 0.98
  max_residual_autocorrelation: 0.5
  storage_correction: auto                    # auto | brace | dicker_smits
  max_storage_ratio: 0.05                     # warn above this V_pore/V on the Brace form
  leak_test_duration_s: 3600.0                # a leak test is a FIXED observation
  max_leak_fraction: 0.05                     # warn above this share of rig-vs-sample decay
  leak_correction: 'off'                      # off | subtract
  leak_pressure_tolerance: 0.2                # a test at another charge does not apply
  expected_permeability: null                 # planning only; never enters a result
  expected_permeability_unit: uD

# ISO/IEC Guide 98-3 (GUM) evaluation. Type A comes from the scatter of
# the steady-state window; Type B from the specs in hardware.yaml and
# the caliper figures in sample.yaml.
uncertainty:
  enabled: true
  coverage_probability: 0.95                  # 0.95 -> k ~ 2 for large dof
  include_type_a: true
  fixed_coverage_factor: null                 # null = derive from Student-t
  max_component_contribution: 0.25            # warn when one input is worth this fraction of k
averaging_window_s: 5.0                       # live display only; the result uses the steady window

# Output.
output_dir: ./runs
display_pressure_unit: kPa                    # console/plot only
display_permeability_unit: mD                 # mD | D | uD | um2 | m2
display_flow_unit: sccm

# The optional live window, only opened by 'collect --plot'. Each listed
# quantity gets its own panel, stacked in this order, and the panels the
# detector watches carry its criteria: the window mean, the scatter
# tolerance band, and the fitted drift line. Display only -- nothing here
# changes a reading or a reported result.
plot:
  panels: [inlet_pressure, outlet_pressure, delta_pressure, decay_fraction, flow, temperature,
  permeability] # one stacked panel each, top to bottom
  window_s: null                              # trailing seconds to show; null = whole run from t0
  show_criteria: true                         # draw the steady-state bands and drift line
  redraw_interval_s: 0.5
  max_points: 3600                            # per series; the from-t0 view decimates to fit

# Stop conditions.
duration_s: null                              # null = run until Ctrl+C
max_samples: null
stop_after_steady_s: null                     # seconds of confirmed steady state, then stop; null = Ctrl+C
flush_every_n: 20
